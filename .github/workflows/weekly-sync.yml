name: Weekly sync from upstream

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:  # allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run extraction script
        run: node scripts/extract.js

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            UPSTREAM_SHA=$(node -e "console.log(require('./fodmap.meta.json').source_commit)")
            git add fodmap.json fodmap.meta.json
            git commit -m "chore: weekly sync from upstream (${UPSTREAM_SHA})"
            git push
            echo "✅ Changes committed and pushed"
          else
            echo "ℹ️  No updates this week"
          fi
